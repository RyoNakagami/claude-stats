name: Post Pull Request Processing

on:
  pull_request:
    branches:
      - main
    types:
      - closed  # PR closure event

permissions:
  contents: write

jobs:
  post_merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # -------------------------------
      # Step 1: Create Python setup
      # -------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      # -------------------------------
      # Step 2: Create Git tag from pyproject.toml
      # -------------------------------
      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Tag main branch
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # -------------------------------
      # Step 3: Create GitHub Release
      # -------------------------------
      - name: Extract release notes to file
        run: |
          python3 - <<'EOF'
          import re
          changelog = open("CHANGELOG.md").read()
          version = "${{ steps.version.outputs.version }}"
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## |\Z)"
          match = re.search(pattern, changelog, re.DOTALL)
          notes = match.group(0).strip() if match else ""
          open("release_notes.md", "w").write(notes)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ steps.version.outputs.tag }}
          name:      ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
